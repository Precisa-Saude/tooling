name: CI/CD

# Esta entrada pertence ao repositório. Triggers, permissões, flags de release
# e jobs específicos são editados aqui. As implementações compartilhadas são
# chamadas por SHA; o Renovate propõe atualizações com revisão e CI.
# `.precisa.json` fornece os valores iniciais durante a criação do repositório.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for a manual review re-run'
        required: false
        type: number

# Cada job declara apenas as permissões necessárias.
permissions:
  contents: read

# Cancelar uma publicação pode deixar uma tag sem pacote no registry.
# Cancelamento automático fica restrito aos PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── CI checks (every PR and push) ──────────────────────────────
  checks:
    permissions:
      contents: read
    uses: Precisa-Saude/tooling/.github/workflows/_checks.yml@{{WORKFLOW_REF}} # v{{WORKFLOW_VERSION}}

  # ── Automated code review (PR, or manual dispatch, after checks) ─
  review:
    permissions:
      contents: read
      issues: read
      pull-requests: write
      models: read
    needs: checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number > 0)
    uses: Precisa-Saude/tooling/.github/workflows/review.yml@{{WORKFLOW_REF}} # v{{WORKFLOW_VERSION}}
    with:
      # Converte o valor recebido por workflow_dispatch para o tipo number.
      pr_number: ${{ fromJSON(github.event.pull_request.number || inputs.pr_number || 0) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  # {{#if PUBLISHES_TO_NPM}}

  # ── Release (main only, guarded on package changes) ────────────
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: Precisa-Saude/tooling/.github/workflows/_release.yml@{{WORKFLOW_REF}} # v{{WORKFLOW_VERSION}}
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # ── Publish to npm (when release created a new version) ────────
  publish:
    permissions:
      contents: read
      id-token: write
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Precisa-Saude/tooling/.github/workflows/_publish.yml@{{WORKFLOW_REF}} # v{{WORKFLOW_VERSION}}
    with:
      release_sha: ${{ needs.release.outputs.release_sha }}
      # Newline-separated list of package directories. One per line.
      packages: |
        {{PUBLISH_PACKAGES_YAML}}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  # {{/if}}
  # {{#if HAS_SITE}}

  # ── Deploy site (Cloudflare Pages + Slack notify) ──────────────
  # Dispatch com pr_number é um re-run de review, não um pedido de deploy —
  # por isso o guard extra: sem ele, re-rodar o review de um PR redeployava
  # o site junto.
  deploy-site:
    needs: checks
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.pr_number)
    uses: Precisa-Saude/tooling/.github/workflows/_deploy-site.yml@{{WORKFLOW_REF}} # v{{WORKFLOW_VERSION}}
    with:
      project_name: '{{SITE_PROJECT_NAME}}'
      site_filter: '{{SITE_FILTER}}'
      site_source_path: '{{SITE_SOURCE_PATH}}'
    secrets: inherit
  # {{/if}}
