name: Code Review

# Revisão externa exige .github/review-policy.json no commit base do PR.
# Provedores, fallback e caminhos precisam de autorização explícita.
# Consulte docs/security.md antes de adotar uma nova versão do workflow.

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
    inputs:
      exclude_paths:
        description: 'Pathspecs git a excluir da revisão, separados por espaço'
        type: string
        default: ''
      pr_number:
        description: 'PR number to review'
        type: number
        required: true

jobs:
  check-review-status:
    name: Check review status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # Checkout de repositórios privados exige leitura de conteúdo.
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      review_round: ${{ steps.check.outputs.review_round }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decide whether to run
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ inputs.pr_number }};

            // Paginamos listFiles porque em PRs grandes o .tsx/.ts real pode
            // cair em página 2+ e a detecção de "código mudou" dava falso
            // negativo, pulando o review.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const ignore = [/\.md$/, /^docs\//, /^\.github\//, /\.json$/, /\.ya?ml$/, /\.cff$/];
            // Workflows executam comandos e precisam de revisão.
            const isWorkflow = (filename) =>
              /^\.github\/workflows\/.+\.ya?ml$/.test(filename);
            const hasCode = files.some(
              f => isWorkflow(f.filename) || !ignore.some(p => p.test(f.filename)),
            );
            if (!hasCode) {
              core.setOutput('should_run', 'false');
              core.setOutput('review_round', 'skip');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const round1 = comments.some(c => c.body?.includes('<!-- AUTOMATED_REVIEW_ROUND_1 -->'));
            const round2 = comments.some(c => c.body?.includes('<!-- AUTOMATED_REVIEW_ROUND_2_COMPLETE -->'));

            if (round2) {
              core.setOutput('should_run', 'false');
              core.setOutput('review_round', 'complete');
              return;
            }
            core.setOutput('should_run', 'true');
            core.setOutput('review_round', round1 ? '2' : '1');

  review:
    name: Automated review
    needs: check-review-status
    if: needs.check-review-status.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      # Só é usado quando github-models está autorizado na política.
      models: read
    env:
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      OPENAI_MODEL: gpt-4o-mini
      GITHUB_MODELS_MODEL: openai/gpt-4o-mini
      MAX_DIFF_SIZE: '150000'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build review input
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_ROUND: ${{ needs.check-review-status.outputs.review_round }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # Exclusões adicionais nunca ampliam a política da base.
          REVIEW_EXCLUDE_PATHS: ${{ inputs.exclude_paths || vars.REVIEW_EXCLUDE_PATHS }}
        run: |
          node << 'SCRIPT'
          const fs = require('node:fs');
          const { join } = require('node:path');
          const { execFileSync } = require('node:child_process');
          const output = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          const run = (command, args) => {
            try {
              return execFileSync(command, args, {
                encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, stdio: ['ignore', 'pipe', 'pipe'],
              });
            } catch {
              throw new Error('Falha ao preparar revisão; nenhum conteúdo foi transmitido.');
            }
          };
          const api = (path) => JSON.parse(run('gh', ['api', path]));
          const number = process.env.PR_NUMBER;
          const repo = process.env.GITHUB_REPOSITORY;
          if (!/^[1-9]\d*$/.test(number) || !/^[\w.-]+\/[\w.-]+$/.test(repo)) {
            throw new Error('Contexto do PR inválido.');
          }
          const pr = api(`repos/${repo}/pulls/${number}`);
          const sha = /^[a-f0-9]{40}$/;
          if (pr.base.repo.full_name !== repo || !sha.test(pr.base.sha) || !sha.test(pr.head.sha)) {
            throw new Error('Referências do PR inválidas.');
          }
          // A política vem da base revisada. Alterações no próprio PR só valem após merge.
          const file = api(`repos/${repo}/contents/.github/review-policy.json?ref=${pr.base.sha}`);
          if (file.type !== 'file' || file.encoding !== 'base64' || file.size > 16384) {
            throw new Error('Política de exportação ausente ou inválida.');
          }
          const policy = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
          const keys = ['enabled', 'provider', 'fallbackProviders', 'includePaths', 'excludePaths', 'scanForSecretsBeforeSending', 'onSensitiveContent'];
          if (!policy || typeof policy !== 'object' || Array.isArray(policy) ||
              typeof policy.enabled !== 'boolean' || Object.keys(policy).some(key => !keys.includes(key))) {
            throw new Error('Política de exportação inválida.');
          }
          if (!policy.enabled) {
            output('enabled', 'false');
            console.log('Revisão externa desabilitada pela política.');
          } else {
            const providers = ['anthropic', 'openai', 'github-models'];
            if (!providers.includes(policy.provider) || !Array.isArray(policy.fallbackProviders) ||
                !policy.fallbackProviders.every(name => providers.includes(name)) ||
                policy.scanForSecretsBeforeSending !== true || policy.onSensitiveContent !== 'block') {
              throw new Error('Provedores ou proteção de conteúdo inválidos.');
            }
            const validPaths = paths => Array.isArray(paths) && paths.length <= 100 && paths.every(path =>
              typeof path === 'string' && path.length > 0 && path.length < 512 &&
              !/[\x00-\x20\x7f\\:]/.test(path) && !path.startsWith('/') &&
              !path.split('/').some(segment => segment === '..' || segment === '.'));
            if (!validPaths(policy.includePaths) || policy.includePaths.length === 0 || !validPaths(policy.excludePaths)) {
              throw new Error('Caminhos da política inválidos.');
            }
            const extraExcludes = (process.env.REVIEW_EXCLUDE_PATHS || '').trim().split(/\s+/).filter(Boolean);
            if (!validPaths(extraExcludes)) throw new Error('Exclusões adicionais inválidas.');
            // Exclusões mínimas são obrigatórias, inclusive quando a política permite **.
            const excludes = ['**/.env', '**/.env.*', '**/*.pem', '**/*.key', '**/*.p12', '**/*.pfx',
              '**/id_rsa', '**/id_ed25519', '**/patient-data/**', '**/exports/**',
              ...policy.excludePaths, ...extraExcludes];
            run('git', ['fetch', '--no-tags', 'origin', `refs/pull/${number}/head`]);
            if (run('git', ['rev-parse', 'FETCH_HEAD']).trim() !== pr.head.sha) {
              throw new Error('O PR mudou durante a preparação; execute novamente.');
            }
            run('git', ['fetch', '--no-tags', 'origin', pr.base.sha]);
            const range = `${pr.base.sha}...${pr.head.sha}`;
            const paths = [...policy.includePaths.map(path => `:(top,glob)${path}`),
              ...excludes.map(path => `:(top,glob,exclude)${path}`)];
            const args = ['diff', '--no-ext-diff', '--no-textconv', '--no-renames'];
            const files = run('git', [...args, '--name-only', '-z', range, '--', ...paths]).split('\0').filter(Boolean);
            if (files.some(path => /[\x00-\x1f\x7f]/.test(path))) throw new Error('Nome de arquivo não suportado.');
            const diff = run('git', [...args, range, '--', ...paths]);
            // Heurística complementar às exclusões. Não identifica todos os dados sensíveis.
            const secretPatterns = [
              /\b(?:AKIA|ASIA)[A-Z0-9]{16}\b/,
              /\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|npm_[A-Za-z0-9]{30,})\b/,
              /\bsk-(?:proj-|ant-api\d+-)?[A-Za-z0-9_-]{24,}\b/,
              /\bAIza[A-Za-z0-9_-]{30,}\b/,
              /\bxox[baprs]-[A-Za-z0-9-]{20,}\b/,
              /-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----/,
              /\beyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}/,
              /https?:\/\/[^\s/:@]{3,}:[^\s/@]{6,}@/,
              /(?:api[_-]?key|client[_-]?secret|access[_-]?token|password|_authToken)\s*[=:]\s*["'][A-Za-z0-9_+/=.-]{16,}["']/i,
            ];
            // Verifica antes de truncar, inclusive linhas removidas e nomes de arquivo.
            if (secretPatterns.some(pattern => pattern.test(`${files.join('\n')}\n${diff}`))) {
              throw new Error('Possível segredo detectado; exportação bloqueada sem registrar o conteúdo.');
            }
            const max = Number(process.env.MAX_DIFF_SIZE);
            if (!Number.isInteger(max) || max < 1 || max > 150000) throw new Error('Limite de diff inválido.');
            const bytes = Buffer.from(diff);
            const inputDir = fs.mkdtempSync(join(process.env.RUNNER_TEMP, 'review-input-'));
            fs.writeFileSync(join(inputDir, 'pr.diff'), bytes.subarray(0, max));
            fs.writeFileSync(join(inputDir, 'changed_files.txt'), files.join('\n'));
            output('input_dir', inputDir);
            output('providers', JSON.stringify([...new Set([policy.provider, ...policy.fallbackProviders])]));
            output('head_sha', pr.head.sha);
            output('number', number);
            output('diff_truncated', String(bytes.length > max));
            output('enabled', String(files.length > 0 && diff.length > 0));
          }
          SCRIPT

      - name: Call approved review providers
        if: steps.pr.outputs.enabled == 'true'
        id: call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GitHub Models uses the built-in GITHUB_TOKEN; `models: read`
          # on the job permissions is what actually authorizes the call.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_INPUT_DIR: ${{ steps.pr.outputs.input_dir }}
          REVIEW_PROVIDERS: ${{ steps.pr.outputs.providers }}
          DIFF_TRUNCATED: ${{ steps.pr.outputs.diff_truncated }}
          REVIEW_ROUND: ${{ needs.check-review-status.outputs.review_round }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');

          const { join } = require('node:path');
          const inputDir = process.env.REVIEW_INPUT_DIR;
          const diff = fs.readFileSync(join(inputDir, 'pr.diff'), 'utf8');
          const files = fs.readFileSync(join(inputDir, 'changed_files.txt'), 'utf8').trim();
          const round = process.env.REVIEW_ROUND;
          const truncated = process.env.DIFF_TRUNCATED === 'true';

          const system = [
            'You are a senior software engineer performing a code review.',
            'Analyze the PR diff carefully and provide actionable, specific feedback.',
            'Focus on bugs, security issues, performance problems, and significant code-quality concerns.',
            'Do not include nitpicks, style preferences, or suggestions to add comments.',
          ].join(' ');

          const user = [
            `Review Round: ${round}`,
            '',
            '## Files changed in this PR',
            'These are the ONLY files modified. Do NOT reference any other files in feedback:',
            files,
            '',
            truncated ? '> **Note**: Diff truncated due to size. Review only what is shown below.\n' : '',
            '## Diff',
            '',
            '```diff',
            diff,
            '```',
            '',
            'Respond with ONLY a valid JSON object (no markdown fences). Use this exact structure:',
            '{"summary": "...", "changes": ["..."], "feedback": [{"file": "path", "line": 42, "comment": "..."}]}',
            '',
            'Rules:',
            '- The "file" field MUST be one of the files listed above.',
            '- The "line" field MUST reference a line number from the NEW version (right side of diff, + lines). Cross-check against @@ hunk headers.',
            '- Include feedback only for real issues; skip nits.',
            '- Do NOT hallucinate code not visible in the diff.',
            '- If no issues, return an empty feedback array.',
          ].join('\n');

          // Pricing por 1M tokens USD. Atualizar quando providers mudarem rates.
          // Entradas faltando silenciosamente pulam exibição de custo (tokens
          // ainda são mostrados).
          const PRICING = {
            'claude-haiku-4-5-20251001': { in: 1.00, out: 5.00 },
            'claude-sonnet-4-6': { in: 3.00, out: 15.00 },
            'claude-opus-4-7': { in: 15.00, out: 75.00 },
            'gpt-4o-mini': { in: 0.15, out: 0.60 },
            'gpt-4o': { in: 2.50, out: 10.00 },
            'gpt-5-mini': { in: 0.25, out: 2.00 },
          };

          function computeCost(model, promptTokens, completionTokens) {
            const rate = PRICING[model];
            if (!rate) return null;
            return (promptTokens / 1_000_000) * rate.in + (completionTokens / 1_000_000) * rate.out;
          }

          const providers = {
            anthropic: {
              label: 'Anthropic',
              envKey: 'ANTHROPIC_API_KEY',
              modelEnv: 'ANTHROPIC_MODEL',
              defaultModel: 'claude-haiku-4-5-20251001',
              build: (model, key) => ({
                url: 'https://api.anthropic.com/v1/messages',
                headers: {
                  'content-type': 'application/json',
                  'x-api-key': key,
                  'anthropic-version': '2023-06-01',
                },
                body: JSON.stringify({
                  model,
                  max_tokens: 8192,
                  system,
                  messages: [{ role: 'user', content: user }],
                }),
              }),
              extractText: (r) => r?.content?.[0]?.text ?? '',
              extractUsage: (r) => ({
                prompt_tokens: r?.usage?.input_tokens ?? 0,
                completion_tokens: r?.usage?.output_tokens ?? 0,
              }),
              extractError: (r) => r?.error?.message ?? r?.message ?? 'see workflow logs',
            },
            openai: {
              label: 'OpenAI',
              envKey: 'OPENAI_API_KEY',
              modelEnv: 'OPENAI_MODEL',
              defaultModel: 'gpt-4o-mini',
              build: (model, key) => ({
                url: 'https://api.openai.com/v1/chat/completions',
                headers: {
                  'content-type': 'application/json',
                  Authorization: `Bearer ${key}`,
                },
                body: JSON.stringify({
                  model,
                  max_tokens: 8192,
                  messages: [
                    { role: 'system', content: system },
                    { role: 'user', content: user },
                  ],
                  response_format: { type: 'json_object' },
                }),
              }),
              extractText: (r) => r?.choices?.[0]?.message?.content ?? '',
              extractUsage: (r) => ({
                prompt_tokens: r?.usage?.prompt_tokens ?? 0,
                completion_tokens: r?.usage?.completion_tokens ?? 0,
              }),
              extractError: (r) => r?.error?.message ?? 'see workflow logs',
            },
            // GitHub Models — OpenAI-compatible API authenticated via the
            // built-in GITHUB_TOKEN + `models: read` permission. No
            // external API key needed, so this is the fallback when
            // neither Anthropic nor OpenAI secrets are configured.
            // Rate limits apply per-repo; the models catalog lists what's
            // available. `openai/gpt-4o-mini` is a safe default.
            'github-models': {
              label: 'GitHub Models',
              envKey: 'GITHUB_TOKEN',
              modelEnv: 'GITHUB_MODELS_MODEL',
              defaultModel: 'openai/gpt-4o-mini',
              build: (model, key) => ({
                url: 'https://models.github.ai/inference/chat/completions',
                headers: {
                  'content-type': 'application/json',
                  Authorization: `Bearer ${key}`,
                },
                body: JSON.stringify({
                  model,
                  max_tokens: 8192,
                  messages: [
                    { role: 'system', content: system },
                    { role: 'user', content: user },
                  ],
                  response_format: { type: 'json_object' },
                }),
              }),
              extractText: (r) => r?.choices?.[0]?.message?.content ?? '',
              extractUsage: (r) => ({
                prompt_tokens: r?.usage?.prompt_tokens ?? 0,
                completion_tokens: r?.usage?.completion_tokens ?? 0,
              }),
              extractError: (r) => r?.error?.message ?? 'see workflow logs',
            },
          };

          // A lista validada na base é a única autorização para transmissão.
          const order = JSON.parse(process.env.REVIEW_PROVIDERS);

          const setOutput = (k, v) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}<<EOF\n${String(v)}\nEOF\n`);
          };

          async function tryProvider(name) {
            const p = providers[name];
            const key = process.env[p.envKey];
            if (!key) return { ok: false, reason: 'no key configured', skip: true };

            const model = process.env[p.modelEnv] || p.defaultModel;
            const req = p.build(model, key);

            try {
              const resp = await fetch(req.url, {
                method: 'POST',
                headers: req.headers,
                body: req.body,
              });
              const text = await resp.text();
              let parsed;
              try {
                parsed = JSON.parse(text);
              } catch {
                return { ok: false, reason: `HTTP ${resp.status}: non-JSON response`, provider: name, model };
              }
              if (!resp.ok) {
                return {
                  ok: false,
                  reason: `HTTP ${resp.status}`,
                  provider: name,
                  model,
                };
              }
              const reviewText = p.extractText(parsed);
              const usage = p.extractUsage(parsed);
              return { ok: true, provider: name, model, reviewText, usage };
            } catch (e) {
              return { ok: false, reason: 'network error', provider: name, model };
            }
          }

          (async () => {
            const attempts = [];
            let winner = null;

            for (const name of order) {
              const attempt = await tryProvider(name);
              attempts.push(attempt);
              if (attempt.ok) {
                winner = attempt;
                break;
              }
              if (attempt.skip) continue;
              console.log(`::warning::${providers[name].label} failed: ${attempt.reason}`);
            }

            if (!winner) {
              const configured = attempts.filter((a) => !a.skip);
              if (configured.length === 0) {
                console.log('::warning::No review providers configured. Skipping.');
                setOutput('status', 'skipped');
                setOutput('error_reason', 'no providers configured');
              } else {
                const reasons = configured
                  .map((a) => `${providers[a.provider].label}: ${a.reason}`)
                  .join('; ');
                console.log(`::warning::All providers failed. ${reasons}`);
                setOutput('status', 'error');
                setOutput('error_reason', reasons);
              }
              return;
            }

            fs.writeFileSync(join(inputDir, 'review.json'), winner.reviewText);
            setOutput('status', 'ok');
            setOutput('provider_label', providers[winner.provider].label);
            setOutput('provider_model', winner.model);

            const promptTokens = winner.usage.prompt_tokens;
            const completionTokens = winner.usage.completion_tokens;
            const cost = computeCost(winner.model, promptTokens, completionTokens);
            setOutput('prompt_tokens', String(promptTokens));
            setOutput('completion_tokens', String(completionTokens));
            setOutput('cost_usd', cost == null ? '' : cost.toFixed(4));

            const failed = attempts.filter((a) => !a.ok && !a.skip);
            const fellBack = failed.length > 0;
            setOutput('fell_back', fellBack ? 'true' : 'false');
            if (fellBack) {
              const notes = failed
                .map((a) => `${providers[a.provider].label} failed: ${a.reason}`)
                .join('; ');
              console.log(`::notice::Fell back to ${providers[winner.provider].label}. ${notes}`);
            }
          })();
          SCRIPT

      - name: Post review
        if: steps.pr.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REVIEW_ROUND: ${{ needs.check-review-status.outputs.review_round }}
          REVIEW_INPUT_DIR: ${{ steps.pr.outputs.input_dir }}
          REVIEW_STATUS: ${{ steps.call.outputs.status }}
          ERROR_REASON: ${{ steps.call.outputs.error_reason }}
          PROVIDER_LABEL: ${{ steps.call.outputs.provider_label }}
          PROVIDER_MODEL: ${{ steps.call.outputs.provider_model }}
          PROMPT_TOKENS: ${{ steps.call.outputs.prompt_tokens }}
          COMPLETION_TOKENS: ${{ steps.call.outputs.completion_tokens }}
          COST_USD: ${{ steps.call.outputs.cost_usd }}
          FELL_BACK: ${{ steps.call.outputs.fell_back }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const round = process.env.REVIEW_ROUND;
            const status = process.env.REVIEW_STATUS;
            const errorReason = process.env.ERROR_REASON;
            const providerLabel = process.env.PROVIDER_LABEL;
            const providerModel = process.env.PROVIDER_MODEL;
            const promptTokens = Number(process.env.PROMPT_TOKENS || '0');
            const completionTokens = Number(process.env.COMPLETION_TOKENS || '0');
            const costUsd = process.env.COST_USD;
            const fellBack = process.env.FELL_BACK === 'true';

            const fmt = (n) => n.toLocaleString('en-US');
            const costPart = costUsd ? ` | $${costUsd}` : '';
            const usagePart = promptTokens + completionTokens > 0
              ? ` | ${fmt(promptTokens)} in / ${fmt(completionTokens)} out${costPart}`
              : '';
            const fallbackBadge = fellBack ? ' (fallback)' : '';

            // Caminhos de falha — sem marker, de modo que o próximo push
            // retenta como Round 1.
            if (status !== 'ok') {
              const note = status === 'skipped'
                ? `Review skipped — ${errorReason}. No round marker emitted; the next PR activity will retry as Round 1.`
                : `Review failed — ${errorReason}. No round marker emitted; the next PR activity will retry as Round 1.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `### Automated Review — not posted\n\n${note}`,
              });
              return;
            }

            const raw = fs.readFileSync(require('node:path').join(process.env.REVIEW_INPUT_DIR, 'review.json'), 'utf8').trim();
            let review;
            try {
              let s = raw;
              if (s.startsWith('```')) s = s.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '');
              review = JSON.parse(s);
            } catch (e) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## Automated Review (Round ${round})\n\n${raw}\n\n---\n*Reviewed by ${providerLabel} ${providerModel}${fallbackBadge}${usagePart}*`,
              });
              return;
            }

            const summary = review.summary || 'No summary provided';
            const changes = (review.changes || []).map(c => `- ${c}`).join('\n') || '_none_';
            const feedback = review.feedback || [];

            const isRound1 = round === '1';
            const marker = isRound1 ? '<!-- AUTOMATED_REVIEW_ROUND_1 -->' : '<!-- AUTOMATED_REVIEW_ROUND_2_COMPLETE -->';
            const label = isRound1 ? 'Round 1' : 'Round 2 (Final)';

            let body = `## Automated Review — ${label}\n\n${marker}\n\n`;
            body += `### Summary\n${summary}\n\n`;
            body += `### Changes\n${changes}\n\n---\n`;
            body += feedback.length === 0
              ? `:white_check_mark: No issues found\n\n`
              : `:mag: Found ${feedback.length} suggestion${feedback.length === 1 ? '' : 's'} (see inline comments)\n\n`;
            body += `*Reviewed by ${providerLabel} ${providerModel}${fallbackBadge}${usagePart}`;
            body += isRound1 ? ` — Round 1 of 2*` : ` — Round 2 (Final); no further reviews will be performed*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

            for (const item of feedback) {
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  body: item.comment,
                  path: item.file,
                  line: item.line,
                  commit_id: headSha,
                  side: 'RIGHT',
                });
              } catch (e) {
                console.log(`Failed to post comment on ${item.file}:${item.line} — ${e.message}`);
              }
            }
